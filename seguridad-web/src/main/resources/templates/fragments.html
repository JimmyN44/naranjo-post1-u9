<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Seguridad Web'">Seguridad Web</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<!--/* Barra de navegacion comun para usuarios autenticados */-->
<nav th:fragment="nav" class="nav" sec:authorize="isAuthenticated()">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/tareas}">Tareas</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Panel de Administración</a>
    <span class="nav-usuario" sec:authentication="name">usuario</span>
    <!--/* POST con token CSRF incluido automaticamente por Thymeleaf */-->
    <form th:action="@{/logout}" method="post" class="inline">
        <button type="submit" class="btn-secundario">Cerrar Sesión</button>
    </form>
</nav>
</body>
</html>
