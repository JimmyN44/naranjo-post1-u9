spring.application.name=seguridad-web
server.port=${PORT:8080}

# ---------------------------------------------------------------
# MySQL - las credenciales se leen de variables de entorno.
# Ningun secreto se guarda en el repositorio (ver .env.example).
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seguridad_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: crea/actualiza las tablas usuarios y tareas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# ---------------------------------------------------------------
# JWT (Parte 2) - la clave HMAC NO esta en el codigo fuente:
# se inyecta desde la variable de entorno JWT_SECRET (minimo 32 bytes).
# La expiracion es configurable para poder probar tokens expirados.
# ---------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}

# ---------------------------------------------------------------
# Usuario ADMIN inicial (OPCIONAL). Si ambas variables estan vacias
# no se crea nada y se usa el procedimiento manual (docs/sql/admin.sql).
# ---------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
