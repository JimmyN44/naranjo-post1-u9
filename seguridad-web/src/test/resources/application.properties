# Configuracion SOLO para pruebas automatizadas: H2 en memoria en modo MySQL.
# La aplicacion real usa MySQL (src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:seguridad_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# jwt.secret se genera aleatoriamente en cada ejecucion (IntegracionBase)
jwt.expiracion-ms=3600000

app.admin.email=
app.admin.password=
